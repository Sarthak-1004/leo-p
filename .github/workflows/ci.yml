name: Portal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend run db:generate
      - run: npm --prefix backend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm run test:deployment
      - run: npm run build
      - run: npm run build:vercel
        env:
          BACKEND_ORIGIN: https://api.example.test
      - run: npm --prefix backend test
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend run test:live

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: portal_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci_runner -d portal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci_runner:ci-ephemeral-only@127.0.0.1:5432/portal_ci
      APP_ORIGIN: https://portal.example.test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t portal-ci .
      - name: Check runtime startup script and Prisma system dependencies
        run: |
          docker run --rm portal-ci /bin/sh -n /app/backend/scripts/start-container.sh
          docker run --rm portal-ci openssl version
      - name: Check Render startup, private API and SPA navigation
        run: |
          docker run --detach --rm --memory=512m --memory-swap=512m --name portal-ci --network host -e DATABASE_URL -e APP_ORIGIN -e PORT=10000 -e BOOTSTRAP_ADMIN_ID=ci-admin -e BOOTSTRAP_ADMIN_PASSWORD=CI-synthetic-password-only portal-ci /app/backend/scripts/start-container.sh
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:10000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/api/bootstrap)" = "401"
          curl --fail --head http://127.0.0.1:10000/student/dashboard
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://portal.example.test' -H 'Content-Type: application/json' --data '{"role":"admin","identifier":"ci-admin","password":"CI-synthetic-password-only"}' http://127.0.0.1:10000/api/auth/login)" = "200"
      - name: Verify repeat bootstrap without replacing existing Admin credentials
        run: docker run --rm --network host -e DATABASE_URL -e APP_ORIGIN portal-ci npm run db:seed:production
      - name: Verify encrypted backup and isolated restore
        run: |
          npm ci --prefix backend
          npm --prefix backend run db:generate
          npm --prefix backend run backup:verify-test
        env:
          TEST_BACKUP_DATABASE_URL: postgresql://ci_runner:ci-ephemeral-only@127.0.0.1:5432/portal_ci
          PG_CLIENT_DOCKER: 'true'
      - name: Container logs
        if: always()
        run: docker logs portal-ci || true
