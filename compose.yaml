services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kanan
      POSTGRES_USER: kanan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanan -d kanan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
